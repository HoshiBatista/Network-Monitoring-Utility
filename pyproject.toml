[tool.pytest.ini_options]
asyncio_mode   = "auto"
testpaths      = ["tests"]
addopts        = "-ra -q"

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 120
target-version = "py313"
exclude        = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E9", "F", "I"]
ignore = [
  "F821",   # forward refs in SQLAlchemy relationship() strings
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
